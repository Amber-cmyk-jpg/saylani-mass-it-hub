<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Saylani Mass IT Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

<div class="d-flex">

  <!-- SIDEBAR -->
  <div class="sidebar p-3">
    <h5 class="text-white mb-4">SMIT Portal</h5>

    <button id="btnDashboard" class="sidebar-btn active">Dashboard</button>
    <button id="btnLost" class="sidebar-btn">Lost & Found</button>
    <button id="btnComplaints" class="sidebar-btn">Complaints</button>
    <button id="btnVolunteers" class="sidebar-btn">Volunteers</button>

    <button id="btnLogout" class="btn btn-danger mt-4 w-100">Logout</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content p-4" id="mainContent">
    <!-- Content will be loaded dynamically -->
  </div>

</div>

<!-- Report Lost Item Modal -->
<div class="modal fade" id="lostItemModal" tabindex="-1" aria-labelledby="lostItemModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lostItemModalLabel">Report Lost Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="lostItemForm">
          <div class="mb-3">
            <label for="itemName" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="itemName" required>
          </div>
          <div class="mb-3 row">
            <div class="col">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="">Select Category</option>
                <option>Phone</option>
                <option>Wallet</option>
                <option>Bag</option>
              </select>
            </div>
            <div class="col">
              <label for="subcategory" class="form-label">Subcategory</label>
              <select id="subcategory" class="form-select" required>
                <option value="">Select Subcategory</option>
                <option>Electronics</option>
                <option>Accessories</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <select id="location" class="form-select">
              <option value="">Select Location</option>
              <option>Building A</option>
              <option>Building B</option>
              <option>Hall C</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Urgency</label>
            <div class="d-flex gap-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="urgency" id="low" value="Low" checked>
                <label class="form-check-label" for="low">Low</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="urgency" id="medium" value="Medium">
                <label class="form-check-label" for="medium">Medium</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="urgency" id="high" value="High">
                <label class="form-check-label" for="high">High</label>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Submit Report</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
