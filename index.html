<!DOCTYPE html>
<html>
<head>
  <title>Saylani Mass IT Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-container shadow-lg">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <img src="assets/saylani-logo.png" class="logo">

    <h1>Campus Portal</h1>
    <p>
      Manage reports, complaints<br>
      & events in one place.
    </p>

    <div class="wave"></div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-panel">
    <div class="login-card shadow">

      <h4 class="mb-3">Login</h4>

      <input type="email" id="email" class="form-control mb-3" placeholder="Email">
      <input type="password" id="password" class="form-control mb-3" placeholder="Password">

      <div class="d-flex mb-3">
        <button class="btn btn-light w-50 me-2">Student</button>
        <button class="btn btn-light w-50">Admin</button>
      </div>

      <button class="btn btn-primary w-100 mb-3" onclick="login()">
        Log In
      </button>

      <button class="btn btn-outline-secondary w-100">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="18">
        Sign in an account
      </button>

      <p class="text-danger mt-2" id="error"></p>

    </div>
  </div>

</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
